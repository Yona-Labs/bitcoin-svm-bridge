on:
  push:
    branches: [ ci ]

env:
  CARGO_TERM_COLOR: always
  IMAGE_REPOSITORY: registry.digitalocean.com/mov3r-container/$CI_PROJECT_NAME

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        env: [ prod ]
    outputs:
      app-image: ${{ steps.build-app-image.outputs.IMAGE }}
      image-tag: ${{ steps.build-app-image.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Build/push app image
        id: build-app-image
        run: |
          export IMAGE=$IMAGE_REPOSITORY/${{ matrix.env }}/app
          export IMAGE_TAG=$(echo $GITHUB_SHA | head -c7)

          docker build \
            --cache-from type=registry,ref=$IMAGE:cache \
            --cache-to type=registry,ref=$IMAGE:cache,mode=max \
            -t $IMAGE:$IMAGE_TAG \
            -t $IMAGE:latest \
            --target app \
            --push \
            .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"
